<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">Impact in numbers</title>
  <desc id="d">6 production apps shipped in 5 months. 6,000+ automated tests across the team. Route computation cut from 33 seconds to 1.2 seconds, about 27 times faster. Around 50 business modules in a multi-tenant SaaS.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .card { opacity: 0; animation: pop .7s cubic-bezier(.2,.9,.25,1.2) forwards; }
      .a1 { animation-delay: .1s } .a2 { animation-delay: .3s } .a3 { animation-delay: .5s } .a4 { animation-delay: .7s }
      @keyframes pop { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; transform: scaleX(0); transform-box: fill-box; transform-origin: left }
      .b1 { animation-delay: .5s } .b2 { animation-delay: .7s } .b3 { animation-delay: .9s } .b4 { animation-delay: 1.1s }
      @keyframes grow { to { transform: scaleX(1) } }
      .big { font-size: 54px; font-weight: 800 }
      .lbl { font-size: 17px; fill: #e2e8f0; font-weight: 600 }
      .sub { font-size: 13.5px; fill: #64748b }
      .tag { font-size: 12px; fill: #94a3b8; letter-spacing: 2px }
    </style>
  </defs>

  <!-- card 1 -->
  <g class="card a1">
    <g transform="translate(2 2)">
      <rect width="282" height="194" rx="16" fill="url(#cardbg)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" class="mono tag">// SHIPPED</text>
      <text x="22" y="104" class="sans big" fill="url(#g1)">6 apps</text>
      <text x="24" y="136" class="sans lbl">in production, in 5 months</text>
      <text x="24" y="160" class="sans sub">healthcare · tax SaaS · F&amp;B retail</text>
      <rect class="bar b1" x="24" y="176" width="234" height="4" rx="2" fill="url(#g1)"/>
    </g>
  </g>
  <!-- card 2 -->
  <g class="card a2">
    <g transform="translate(306 2)">
      <rect width="282" height="194" rx="16" fill="url(#cardbg)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" class="mono tag">// QUALITY</text>
      <text x="22" y="104" class="sans big" fill="url(#g2)">6,000+</text>
      <text x="24" y="136" class="sans lbl">automated tests</text>
      <text x="24" y="160" class="sans sub">CI on every repo · OpenAPI on every API</text>
      <rect class="bar b2" x="24" y="176" width="234" height="4" rx="2" fill="url(#g2)"/>
    </g>
  </g>
  <!-- card 3 -->
  <g class="card a3">
    <g transform="translate(610 2)">
      <rect width="282" height="194" rx="16" fill="url(#cardbg)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" class="mono tag">// PERFORMANCE</text>
      <text x="22" y="104" class="sans big" fill="url(#g3)">27×</text>
      <text x="24" y="136" class="sans lbl">faster: 33s → 1.2s</text>
      <text x="24" y="160" class="sans sub">nationwide routing in Japan · pgRouting</text>
      <rect class="bar b3" x="24" y="176" width="234" height="4" rx="2" fill="url(#g3)"/>
    </g>
  </g>
  <!-- card 4 -->
  <g class="card a4">
    <g transform="translate(914 2)">
      <rect width="282" height="194" rx="16" fill="url(#cardbg)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" class="mono tag">// SCALE</text>
      <text x="22" y="104" class="sans big" fill="url(#g4)">~50</text>
      <text x="24" y="136" class="sans lbl">modules, multi-tenant SaaS</text>
      <text x="24" y="160" class="sans sub">built end-to-end in ~3.5 months</text>
      <rect class="bar b4" x="24" y="176" width="234" height="4" rx="2" fill="url(#g4)"/>
    </g>
  </g>
</svg>
