<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Thanks for stopping by — let's build something great.</title>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <style>
      .w1 { animation: wave 9s ease-in-out infinite alternate }
      .w2 { animation: wave 13s ease-in-out infinite alternate-reverse }
      @keyframes wave { from { transform: translateX(0) } to { transform: translateX(-200px) } }
      .t { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 17px; fill: #818cf8; opacity: 0; animation: in 1.2s ease .3s forwards }
      @keyframes in { to { opacity: 1 } }
    </style>
  </defs>
  <path class="w2" d="M0 80 C 150 40 300 120 450 80 S 750 40 900 80 S 1200 120 1400 80 V150 H0Z" fill="url(#w)" opacity=".18"/>
  <path class="w1" d="M0 100 C 200 60 350 140 550 100 S 850 60 1050 100 S 1300 130 1400 100 V150 H0Z" fill="url(#w)" opacity=".35"/>
  <text x="600" y="48" text-anchor="middle" class="t">&lt;/&gt; thanks for stopping by — let's build something great together.</text>
</svg>
