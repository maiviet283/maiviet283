<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Mai Quốc Việt — Full-Stack Developer &amp; Team Lead</title>
  <desc id="d">Full-stack developer and team lead building production systems with Python, Django, FastAPI, React and PostgreSQL. Based in Da Nang, Vietnam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s } .d5 { animation-delay: 1.35s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate }
      .orb3 { animation: drift3 16s ease-in-out infinite alternate }
      @keyframes drift1 { to { transform: translate(140px, 60px) } }
      @keyframes drift2 { to { transform: translate(-160px, -40px) } }
      @keyframes drift3 { to { transform: translate(80px, -70px) } }
      .scan { animation: scan 6s linear infinite }
      @keyframes scan { from { transform: translateX(-400px) } to { transform: translateX(1300px) } }
      .pulse { animation: pulse 1.6s ease-in-out infinite }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      .ring { transform-origin: 1010px 92px; animation: spin 24s linear infinite }
      .ring2 { transform-origin: 1010px 92px; animation: spin 36s linear infinite reverse }
      @keyframes spin { to { transform: rotate(360deg) } }
      .chip rect { fill: #0f172a; stroke: #334155 }
      .chip text { fill: #cbd5e1; font-size: 15px }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)" opacity=".7"/>

    <!-- ambient orbs -->
    <circle class="orb1" cx="180" cy="80" r="150" fill="#22d3ee" opacity=".22" filter="url(#blur)"/>
    <circle class="orb2" cx="1040" cy="300" r="170" fill="#a855f7" opacity=".25" filter="url(#blur)"/>
    <circle class="orb3" cx="640" cy="360" r="120" fill="#6366f1" opacity=".2" filter="url(#blur)"/>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="260" height="380" fill="url(#line)" opacity=".05"/>

    <!-- orbit ornament -->
    <g opacity=".55">
      <circle class="ring" cx="1010" cy="92" r="46" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 10"/>
      <circle class="ring2" cx="1010" cy="92" r="64" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="40 14 4 14"/>
      <text x="1010" y="99" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#e2e8f0">&lt;/&gt;</text>
    </g>

    <!-- top bar -->
    <g class="rise d1">
      <circle cx="64" cy="58" r="6" fill="#22c55e" class="pulse"/>
      <text x="80" y="63" class="mono" font-size="15" fill="#94a3b8">status: <tspan fill="#4ade80">shipping to production</tspan></text>
    </g>

    <!-- name -->
    <g class="rise d2">
      <text x="60" y="158" class="sans" font-size="72" font-weight="800" letter-spacing="1" fill="url(#name)" filter="url(#glow)">MAI QUỐC VIỆT</text>
    </g>

    <!-- role -->
    <g class="rise d3">
      <text x="62" y="204" class="mono" font-size="22" fill="#e2e8f0">
        <tspan fill="#c084fc">const</tspan> <tspan fill="#22d3ee">role</tspan> = <tspan fill="#fbbf24">"Full-Stack Developer &amp; Team Lead"</tspan>;
      </text>
    </g>

    <g class="rise d4">
      <rect x="60" y="226" width="520" height="2" fill="url(#line)"/>
      <text x="62" y="262" class="sans" font-size="18" fill="#94a3b8">Design it  ·  Ship it  ·  Run it in production — from schema to deploy.</text>
    </g>

    <!-- chips -->
    <g class="rise d5">
      <g class="chip mono" transform="translate(60 292)"><rect width="96" height="34" rx="17"/><text x="48" y="22" text-anchor="middle">Python</text></g>
      <g class="chip mono" transform="translate(166 292)"><rect width="96" height="34" rx="17"/><text x="48" y="22" text-anchor="middle">Django</text></g>
      <g class="chip mono" transform="translate(272 292)"><rect width="104" height="34" rx="17"/><text x="52" y="22" text-anchor="middle">FastAPI</text></g>
      <g class="chip mono" transform="translate(386 292)"><rect width="86" height="34" rx="17"/><text x="43" y="22" text-anchor="middle">React</text></g>
      <g class="chip mono" transform="translate(482 292)"><rect width="132" height="34" rx="17"/><text x="66" y="22" text-anchor="middle">PostgreSQL</text></g>
      <g class="chip mono" transform="translate(624 292)"><rect width="86" height="34" rx="17"/><text x="43" y="22" text-anchor="middle">Redis</text></g>
      <g class="chip mono" transform="translate(720 292)"><rect width="96" height="34" rx="17"/><text x="48" y="22" text-anchor="middle">Docker</text></g>
    </g>

    <!-- location -->
    <g class="rise d5">
      <text x="1140" y="318" text-anchor="end" class="mono" font-size="15" fill="#64748b">◉  Da Nang, Vietnam</text>
    </g>

    <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
